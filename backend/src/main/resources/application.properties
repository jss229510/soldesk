spring.application.name=comcheck
# Oracle JDBC Driver
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Oracle XE - XEPDB1
spring.datasource.url=${DB_URL}

# Oracle 계정
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 게시판 대표 이미지 1장은 최대 5MB까지 허용한다.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# 256비트 이상의 Base64 JWT_SECRET 환경 변수를 제공한다.
jwt.secret=${JWT_SECRET}

# 카카오페이 서버 인증 정보는 소스에 직접 적지 않고 운영체제 환경 변수에서 읽는다.
# KAKAO_PAY_SECRET_KEY에는 결제용 Secret key(dev 또는 운영 키), CID에는 가맹점 코드를 넣는다.
kakao.pay.secret-key=${KAKAO_PAY_SECRET_KEY}
kakao.pay.cid=${KAKAO_PAY_CID}

# 카카오 결제 인증이 끝난 뒤 브라우저가 돌아올 프론트엔드 주소다.
# 환경 변수가 없으면 로컬 Vite 개발 서버 주소를 기본값으로 사용한다.
kakao.pay.approval-url=${KAKAO_PAY_APPROVAL_URL:http://localhost:5173/payment/kakao/approve}
kakao.pay.cancel-url=${KAKAO_PAY_CANCEL_URL:http://localhost:5173/payment/kakao/cancel}
kakao.pay.fail-url=${KAKAO_PAY_FAIL_URL:http://localhost:5173/payment/kakao/fail}

# 비밀번호 재설정 메일 계정은 소스가 아닌 실행 환경에서 주입한다.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.password-reset.from=${MAIL_FROM:}
app.password-reset.frontend-url=${FRONTEND_URL:http://localhost:5173}
