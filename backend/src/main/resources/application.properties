spring.application.name=comcheck
# Oracle JDBC Driver
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Oracle XE - XEPDB1
spring.datasource.url=${DB_URL}

# Oracle 계정
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 256비트 이상의 Base64 JWT_SECRET 환경 변수를 제공한다.
jwt.secret=${JWT_SECRET}

# 카카오페이 서버 인증 정보는 소스에 직접 적지 않고 운영체제 환경 변수에서 읽는다.
# KAKAO_PAY_SECRET_KEY에는 결제용 Secret key(dev 또는 운영 키), CID에는 가맹점 코드를 넣는다.
kakao.pay.secret-key=${KAKAO_PAY_SECRET_KEY}
kakao.pay.cid=${KAKAO_PAY_CID}

# 카카오 결제 인증이 끝난 뒤 브라우저가 돌아올 프론트엔드 주소다.
# 환경 변수가 없으면 로컬 Vite 개발 서버 주소를 기본값으로 사용한다.
kakao.pay.approval-url=${KAKAO_PAY_APPROVAL_URL:http://localhost:5173/payment/kakao/approve}
kakao.pay.cancel-url=${KAKAO_PAY_CANCEL_URL:http://localhost:5173/payment/kakao/cancel}
kakao.pay.fail-url=${KAKAO_PAY_FAIL_URL:http://localhost:5173/payment/kakao/fail}
