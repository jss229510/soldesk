spring.application.name=comcheck
# Oracle JDBC Driver
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Oracle XE - XEPDB1
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1

# Oracle 계정
spring.datasource.username=jss229510
spring.datasource.password=12345

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 256비트 이상의 Base64 JWT_SECRET 환경 변수를 제공한다.
jwt.secret=${JWT_SECRET}

# 메일 계정은 환경변수로 설정
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.password-reset.from=${MAIL_FROM:}
app.password-reset.frontend-url=${FRONTEND_URL:http://localhost:5173}
